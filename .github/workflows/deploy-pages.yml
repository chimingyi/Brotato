name: 同步游戏到 GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-branch
  cancel-in-progress: true

jobs:
  deploy:
    name: 更新 gh-pages 发布分支
    runs-on: ubuntu-latest

    steps:
      - name: 读取 main 分支
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 同步到 gh-pages 分支
        run: |
          git push origin HEAD:gh-pages --force

