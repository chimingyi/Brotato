<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="薯星幸存者——一个从零开始的 AI 辅助游戏开发项目" />
    <title>薯星幸存者</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">AI 游戏开发实验</p>
          <h1>薯星幸存者</h1>
        </div>
        <div class="topbar-meta">
          <p class="controls">移动：WASD / 方向键　暂停：空格</p>
          <p id="best-record" class="best-record">最高纪录：00:00</p>
          <button id="sound-toggle" class="sound-toggle" type="button" aria-pressed="true">音效：开</button>
        </div>
      </header>

      <section class="game-frame" aria-label="游戏区域">
        <canvas id="game-canvas" width="960" height="540">
          你的浏览器不支持 Canvas，请换一个较新的浏览器。
        </canvas>

        <div class="hud" aria-live="polite">
          <div class="stat-card">
            <span class="stat-label">生命</span>
            <div class="health-track">
              <div id="health-fill" class="health-fill"></div>
            </div>
            <strong id="health-text">100 / 100</strong>
          </div>
          <div class="stat-card stat-card--compact">
            <span class="stat-label">生存时间</span>
            <strong id="timer">00:00</strong>
          </div>
          <div class="stat-card stat-card--compact">
            <span class="stat-label">等级</span>
            <strong id="level-text">1</strong>
          </div>
          <div class="stat-card stat-card--compact">
            <span class="stat-label">击败</span>
            <strong id="kill-count">0</strong>
          </div>
        </div>

        <div id="start-panel" class="panel">
          <p class="panel-kicker">第一次远征</p>
          <h2>准备好了吗？</h2>
          <p>移动躲开敌人，武器会自动攻击。收集能量并坚持 5 分钟！</p>
          <button id="start-button" type="button">开始冒险</button>
        </div>

        <div id="pause-badge" class="pause-badge" hidden>已暂停</div>

        <div id="touch-controls" class="touch-controls" aria-label="触摸移动控制" hidden>
          <div id="joystick-base" class="joystick-base">
            <div id="joystick-knob" class="joystick-knob"></div>
          </div>
        </div>

        <div class="experience-wrap" aria-label="经验值">
          <span id="experience-text">0 / 6</span>
          <div class="experience-track">
            <div id="experience-fill" class="experience-fill"></div>
          </div>
        </div>

        <div id="upgrade-panel" class="panel panel--wide" hidden>
          <p class="panel-kicker">等级提升</p>
          <h2>选择一项强化</h2>
          <p>没有绝对正确的选择，试试组合出自己的打法。</p>
          <div id="upgrade-options" class="upgrade-options"></div>
        </div>

        <div id="game-over-panel" class="panel" hidden>
          <p id="result-kicker" class="panel-kicker">训练结束</p>
          <h2 id="result-title">探险员倒下了</h2>
          <p id="game-over-summary">你坚持了 00:00，击败了 0 个敌人。</p>
          <button id="restart-button" type="button">再试一次</button>
        </div>
      </section>

      <footer>
        <p>第一版 · 坚持 5 分钟即可完成远征</p>
      </footer>
    </main>

    <script type="module" src="src/game.js"></script>
  </body>
</html>
